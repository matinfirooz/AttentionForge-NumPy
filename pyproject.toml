[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentionforge-numpy"
version = "1.0.0"
description = "Attention from scratch: manual gradients, multi-head attention, KV cache, RoPE and tiled online softmax in NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "matinfirooz"}]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]

[project.urls]
Homepage = "https://github.com/matinfirooz"

[tool.setuptools.packages.find]
include = ["attentionforge*"]
